<!DOCTYPE html>
<html lang="zh-TW">
<head>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-teal-500 selection:text-white">

  <!-- ================= TOP NAVIGATION ================= -->

        </div>
      </div>
    </div>
  </section>

  <!-- ================= EXAM SUBMISSION BANNER (EXAM MODE ONLY) ================= -->
  <section id="examSubmitSection" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 w-full hidden">
    <div class="bg-gradient-to-r from-indigo-500 via-purple-600 to-teal-600 rounded-2xl p-5 text-white shadow-lg flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-3 bg-white/20 rounded-xl backdrop-blur-sm text-2xl">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <h2 class="text-lg font-bold">模擬考正在進行中</h2>
          <p class="text-xs sm:text-sm text-white/90">作答過程中不會即時反饋對錯，填寫完畢後點擊按鈕統一交卷計分！</p>
        </div>
      </div>
      <button onclick="submitExam()" class="w-full sm:w-auto px-6 py-3 bg-white text-indigo-700 hover:bg-slate-100 font-extrabold rounded-xl shadow-md transition-all flex items-center justify-center space-x-2">
        <i class="fa-solid fa-paper-plane"></i>
        <span>完成交卷結算</span>

  </section>

  <!-- ================= SCORE REPORT MODAL (ON EXAM FINISH) ================= -->
  <div id="scoreReportModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 text-center transform transition-all scale-95 duration-200" id="scoreModalBox">
      <div class="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-inner mb-4 bg-teal-50 text-teal-600" id="modalScoreIcon">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <span class="text-xs uppercase font-extrabold tracking-widest text-teal-600 bg-teal-50 px-3 py-1 rounded-full" id="modalSubjectTag">數學科測驗報告</span>
      <h3 class="text-2xl font-black text-slate-900 mt-2 mb-1" id="modalScoreTitle">測驗成果非常優異！</h3>
      <p class="text-slate-500 text-sm mb-6" id="modalScoreSubtitle">以下是您本次測驗的詳細成果分析：</p>

      <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 grid grid-cols-3 gap-2 mb-6">
        <div>
          <div class="text-xs text-slate-400 font-medium">總得分</div>
          <div class="text-2xl font-black text-teal-600 mt-1" id="modalFinalScore">0分</div>

        <div>

        <div>
          <div class="text-xs text-slate-400 font-medium">答對率</div>

      <div class="flex flex-col sm:flex-row gap-3">

          <i class="fa-solid fa-magnifying-glass"></i>
          <span>檢視解析與錯題</span>
        </button>
        <button onclick="closeScoreReport(false); resetCurrentQuiz();" class="py-3 px-5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">
          <i class="fa-solid fa-rotate-left mr-1"></i>重新測驗

  <!-- ================= MAIN QUESTION LIST CONTAINER ================= -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1">
    
    <!-- Empty State (When no question matches filters) -->
    <div id="emptyState" class="hidden bg-white rounded-3xl p-12 text-center border border-dashed border-slate-300">
      <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-slate-400 text-2xl mb-4">
        <i class="fa-solid fa-folder-open"></i>
      </div>
      <h3 class="text-lg font-bold text-slate-800">目前分類沒有相符的題目</h3>
      <p class="text-slate-500 text-sm mt-1">您可以切換上方分類，或是取消「僅看錯題」模式。</p>
      <button onclick="clearFilters()" class="mt-4 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl">重置篩選條件</button>

    <!-- Question Cards List -->

  <!-- ================= FLOATING ACTION CONTROLS ================= -->
  <div class="fixed bottom-6 right-6 z-40 flex flex-col space-y-3">
    <button onclick="scrollToTop()" class="w-12 h-12 bg-white/90 hover:bg-white text-slate-700 shadow-xl border border-slate-200 rounded-2xl flex items-center justify-center transition-all hover:scale-105 active:scale-95" title="回到頂部">

  <!-- ================= FOOTER ================= -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-400">
      <p>國小雙學科測驗系統 • 數學試卷（86題）與生活英語（閱讀/重組/文法/分類）完整收錄</p>
      <p class="mt-1">支援即時作答反饋、錯題強化複習與模擬考計分模式</p>
    </div>

  <!-- ================= JAVASCRIPT APPLICATION CODE ================= -->
  <script>
    /* =====================================================================
       1. QUESTION DATABASE (MATHEMATICS 86 QUESTIONS + ENGLISH QUESTIONS)
       ===================================================================== */
    const mathQuestions = [
      // ====== 是非題 29 題 ======
      {
        id: "m_tf_1",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "兩個整數的最大公因數是 1，表示這兩個數是質數。",
        answer: "X",
        explanation: "錯誤。兩個整數最大公因數是 1，只代表兩數「互質」，但不代表這兩數都是質數。例如：8 和 9 都是合數，但 (8, 9) = 1，它們彼此互質。"
      },
      {
        id: "m_tf_2",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "2、3、5、6 都是 30 的質因數。",
        answer: "X",
        explanation: "錯誤。6 雖然是 30 的因數，但 6 是合數（6 = 2 × 3），不是「質數」，因此 6 不是質因數。30 的質因數只有 2、3、5。"
      },
      {
        id: "m_tf_3",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "愛德華測量長方形卡片，卡片的長與寬的比為 2：1，如果寬是 70.5 毫米，長是 141 毫米。",
        answer: "O",
        explanation: "正確。長：寬 = 141：70.5 = (141 ÷ 70.5)：(70.5 ÷ 70.5) = 2：1，敘述符合比例。"
      },
      {
        id: "m_tf_4",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "在小數除法中，如果除數小於 1，所得到的商會比被除數小。",
        answer: "X",
        explanation: "錯誤。當除數小於 1（大於 0）時，除以一個小於 1 的數，所得的商會比被除數「大」。例如：10 ÷ 0.5 = 20 > 10。"
      },
      {
        id: "m_tf_5",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "7 和 11 互質，所以它們的最大公因數是 7×11＝77。",
        answer: "X",
        explanation: "錯誤。兩數互質時，它們的「最大公因數」必定是 1。7×11 = 77 是它們的「最小公倍數」。"
      },
      {
        id: "m_tf_6",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "分數除以分數，可將除數的分子、分母顛倒後，再和被除數相乘。",
        answer: "O",
        explanation: "正確。分數除法的計算法則是：除以一個分數，等於乘以該分數的倒數（分子分母顛倒）。"
      },
      {
        id: "m_tf_7",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "甲＜1，乙＝1，甲÷乙的商一定是真分數。",
        answer: "X",
        explanation: "錯誤。題目中甲只說明「甲 < 1」，若甲為負數或 0，則不構成真分數；在國小正數範圍內，若甲不是分數形式（例如甲為小數），也需視定義而定；最嚴謹的概念為甲÷1 = 甲，甲若為小數如 0.2 或負數則不為真分數。"
      },
      {
        id: "m_tf_8",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "當兩數互質時，兩數之間沒有公因數。",
        answer: "X",
        explanation: "錯誤。任何兩個整數一定有公因數「1」。兩數互質是指公因數「只有 1」，而不是沒有公因數。"
      },
      {
        id: "m_tf_9",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "玫瑰露 2.5 公克 36 元，薄荷露 5.5 公克 44 元，相同重量的薄荷露價錢比玫瑰露便宜。",
        answer: "O",
        explanation: "正確。計算每公克單價：玫瑰露每公克 36 ÷ 2.5 = 14.4 元；薄荷露每公克 44 ÷ 5.5 = 8 元。8 < 14.4，薄荷露確實便宜很多。"
      },
      {
        id: "m_tf_10",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "在小數除法中，甲÷乙＝丙，如果乙＜1，則甲＞丙。",
        answer: "X",
        explanation: "錯誤。如果乙小於 1（例如 0.5），則甲 ÷ 0.5 = 2甲 = 丙，此時丙會大於甲，即甲 < 丙。"
      },
      {
        id: "m_tf_11",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "0.4：0.9 是最簡整數比。",
        answer: "X",
        explanation: "錯誤。0.4 和 0.9 是小數，不是整數。「最簡整數比」前後項必須都是整數且互質，應化為 4：9。"
      },
      {
        id: "m_tf_12",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "在小數除法中，如果除數大於 1，所得到的商會比被除數小。",
        answer: "O",
        explanation: "正確。被除數除以大於 1 的正數，商一定比被除數小。例如：10 ÷ 2 = 5 < 10。"
      },
      {
        id: "m_tf_13",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "要將分數化成最簡分數，就是把分子和分母同除以它們的最小公倍數。",
        answer: "X",
        explanation: "錯誤。要把分數約成最簡分數，應該同除以它們的「最大公因數」，而非最小公倍數。"
      },
      {
        id: "m_tf_14",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "2×2×3×5 和 2×3×3×11 的最小公倍數是 2×2×3×5×2×3×3×11。",
        answer: "X",
        explanation: "錯誤。找最小公倍數時，共同質因數應取次方較大者：2取2個、3取2個、5取1個、11取1個，最小公倍數為 2×2×3×3×5×11，不可直接將兩數相乘。"
      },
      {
        id: "m_tf_15",
        type: "tf",
        category: "tf",
        subject: "math",
        question: "20.05÷0.5＝401。",
        answer: "X",
        explanation: "錯誤。20.05 ÷ 0.5 = 200.5 ÷ 5 = 40.1，而不是 401。"
      },
      {
        id: "m_tf_16",
        type: "tf",
        category: "tf",

    /* =====================================================================
       2. APPLICATION STATE MANAGEMENT
       ===================================================================== */
    let currentSubject = 'math'; // 'math' or 'eng'
    let currentMode = 'instant'; // 'instant' or 'exam'
    let currentCategory = 'all';
    let filterWrongOnly = false;
    let audioEnabled = true;

    // Stores answers: key is question id -> { userChoice, isCorrect, isAnswered }
    const answersState = {};

    // Temporary storage for Unscramble chips
    const unscrambleDrafts = {};

    /* =====================================================================
       3. WEB AUDIO SYNTHESIZER (No external sound files required)
       ===================================================================== */
    let audioCtx = null;
    function playChime(type) {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
          // Cheerful chime: C5 -> E5 -> G5
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.08);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.16);

          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === 'wrong') {
          // Low gentle thud: F#3 -> Eb3
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(185.00, now);
          osc.frequency.exponentialRampToValueAtTime(155.56, now + 0.15);

          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

          osc.start(now);
          osc.stop(now + 0.31);
        } else if (type === 'click') {
          // Subtle click
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch (e) {
        console.warn("Audio Context init deferred", e);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const icon = document.getElementById('audioIcon');
      if (audioEnabled) {
        icon.className = 'fa-solid fa-volume-high text-teal-600';
      } else {
        icon.className = 'fa-solid fa-volume-xmark text-slate-400';
      }
    }

    /* =====================================================================
       4. SUBJECT & MODE SWITCHING
       ===================================================================== */
    function switchSubject(subject) {
      if (currentSubject === subject) return;
      currentSubject = subject;
      currentCategory = 'all';
      filterWrongOnly = false;
      playChime('click');

        badge.textContent = '國小英語';
        iconWrap.className = 'w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-purple-600 text-white flex items-center justify-center text-xl sm:text-2xl shadow-md transition-colors';
        icon.className = 'fa-solid fa-language';
        progressBar.className = 'bg-purple-500 h-full w-0 transition-all duration-300';
      }

      renderCategoryButtons();

    function setQuizMode(mode) {
      currentMode = mode;
      playChime('click');
      const instantBtn = document.getElementById('modeInstantBtn');
      const examBtn = document.getElementById('modeExamBtn');
      const examBanner = document.getElementById('examSubmitSection');

      if (mode === 'instant') {
        instantBtn.className = 'px-2.5 py-1.5 rounded-md bg-teal-600 text-white font-bold transition-all';
        examBtn.className = 'px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all';
        examBanner.classList.add('hidden');
      } else {
        examBtn.className = 'px-2.5 py-1.5 rounded-md bg-indigo-600 text-white font-bold transition-all';
        instantBtn.className = 'px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all';
        examBanner.classList.remove('hidden');
      }

      renderQuestions();
      updateDashboardStats();
    }

    function renderCategoryButtons() {
      const container = document.getElementById('filterButtonGroup');
      container.innerHTML = '';

      let categories = [];
      if (currentSubject === 'math') {
        categories = [
          { key: 'all', label: '全部題目', count: mathQuestions.length },
          { key: 'tf', label: '是非題', count: mathQuestions.filter(q => q.category === 'tf').length },

      } else {

          currentCategory = cat.key;
          filterWrongOnly = false;

    function toggleFilterWrongOnly() {
      filterWrongOnly = !filterWrongOnly;
      playChime('click');
      const btn = document.getElementById('btnWrongFilter');

      renderQuestions();

    function clearFilters() {
      currentCategory = 'all';
      filterWrongOnly = false;
      document.getElementById('btnWrongFilter').className = 'px-2.5 py-1.5 rounded-lg border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold transition-all flex items-center space-x-1';
      renderCategoryButtons();
      renderQuestions();

    /* =====================================================================
       5. QUESTION RENDERING ENGINE
       ===================================================================== */
    function getCurrentDataset() {
      return currentSubject === 'math' ? mathQuestions : engQuestions;
    }

    function renderQuestions() {
      const container = document.getElementById('questionContainer');
      const emptyState = document.getElementById('emptyState');
      const rawList = getCurrentDataset();

      // Apply Filters
      let list = rawList;
      if (currentCategory !== 'all') {
        list = list.filter(q => q.category === currentCategory);
      }
      if (filterWrongOnly) {
        list = list.filter(q => answersState[q.id] && answersState[q.id].isAnswered && !answersState[q.id].isCorrect);
      }

      container.innerHTML = '';

      if (list.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      list.forEach((q, index) => {
        const card = createQuestionCard(q, index + 1);
        container.appendChild(card);
      });
    }

    function createQuestionCard(q, displayIndex) {
      const state = answersState[q.id] || { isAnswered: false, userChoice: null, isCorrect: false };
      const card = document.createElement('div');
      card.id = `card_${q.id}`;
      card.className = "bg-white rounded-2xl border border-slate-200/90 p-5 sm:p-6 shadow-sm hover:shadow-md transition-all";

      // Header: Badge + Category + Question Text
      let typeBadge = '';
      if (q.type === 'tf') {
        typeBadge = `<span class="bg-blue-50 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-md border border-blue-200/60">是非判斷</span>`;
      } else if (q.type === 'unscramble') {
        typeBadge = `<span class="bg-amber-50 text-amber-700 text-xs font-bold px-2 py-0.5 rounded-md border border-amber-200/60">重組拼句</span>`;
      } else if (q.type === 'category_drop') {
        typeBadge = `<span class="bg-emerald-50 text-emerald-700 text-xs font-bold px-2 py-0.5 rounded-md border border-emerald-200/60">單字歸類</span>`;
      } else {
        typeBadge = `<span class="bg-purple-50 text-purple-700 text-xs font-bold px-2 py-0.5 rounded-md border border-purple-200/60">單選題</span>`;
      }

      // Reading Passage Context (if any)
      let contextHtml = '';
      if (q.context) {
        contextHtml = `
          <div class="mb-3 p-3.5 bg-slate-50 border-l-4 border-indigo-400 rounded-r-xl text-slate-700 text-sm leading-relaxed font-serif">
            <div class="text-[11px] font-bold text-indigo-500 uppercase tracking-wider mb-1 flex items-center">
              <i class="fa-solid fa-book-open mr-1"></i> 閱讀短文 / Context
            </div>
            ${q.context}
          </div>
        `;
      }

      // Body depending on question type
      let interactiveBody = '';
      if (q.type === 'tf') {
        interactiveBody = buildTrueFalseButtons(q, state);
      } else if (q.type === 'choice') {
        interactiveBody = buildMultipleChoiceButtons(q, state);
      } else if (q.type === 'unscramble') {
        interactiveBody = buildUnscrambleInteractive(q, state);
      } else if (q.type === 'category_drop') {
        interactiveBody = buildCategoryInteractive(q, state);
      }

      // Explanation box (Shown if answered and not in exam mode)
      const showExplanation = state.isAnswered && (currentMode === 'instant' || state.showInExamReview);
      let explanationHtml = '';
      if (showExplanation) {
        const correctColor = state.isCorrect ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-rose-700 bg-rose-50 border-rose-200';
        const iconType = state.isCorrect ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600';

        explanationHtml = `
          <div class="mt-4 p-4 rounded-xl border ${correctColor} text-sm transition-all duration-300">
            <div class="font-bold flex items-center space-x-1.5 mb-1">
              <i class="fa-solid ${iconType}"></i>
              <span>${state.isCorrect ? '回答正確！' : '回答錯誤！'}</span>
            </div>
            <div class="text-slate-600 text-xs sm:text-sm leading-relaxed mt-1">
              <strong class="text-slate-700">解析觀念：</strong> ${q.explanation}
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="flex items-start justify-between gap-3 mb-2">
          <div class="flex items-center space-x-2">
            <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-700 font-extrabold text-xs flex items-center justify-center">${displayIndex}</span>
            ${typeBadge}
          </div>
          ${state.isAnswered ? `
            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${state.isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
              ${state.isCorrect ? '<i class="fa-solid fa-check mr-1"></i>答對' : '<i class="fa-solid fa-xmark mr-1"></i>答錯'}
            </span>
          ` : ''}
        </div>

        ${contextHtml}

        <div class="text-base sm:text-lg font-bold text-slate-900 leading-snug my-2">
          ${q.question}
        </div>

        <div class="mt-4">
          ${interactiveBody}
        </div>

        ${explanationHtml}
      `;

      return card;
    }

    /* =====================================================================
       6. INTERACTIVE BUILDERS
       ===================================================================== */
    // 6.1 是非題 (True / False)
    function buildTrueFalseButtons(q, state) {
      const isAnswered = state.isAnswered;
      const userChoice = state.userChoice;

      const getBtnStyle = (val) => {
        if (!isAnswered) {
          return "bg-slate-50 hover:bg-slate-100 text-slate-800 border-slate-200";
        }
        if (currentMode === 'exam' && !state.showInExamReview) {
          return userChoice === val ? "bg-indigo-600 text-white border-indigo-600 shadow-md" : "bg-slate-50 text-slate-400 border-slate-200 opacity-60";
        }
        if (q.answer === val) {
          return "bg-emerald-500 text-white border-emerald-500 font-bold shadow-md";
        }
        if (userChoice === val && !state.isCorrect) {
          return "bg-rose-500 text-white border-rose-500 font-bold shadow-md";
        }
        return "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
      };

      return `
        <div class="grid grid-cols-2 gap-3 sm:max-w-md">
          <button onclick="handleAnswer('${q.id}', 'O')" ${isAnswered && currentMode === 'instant' ? 'disabled' : ''}
            class="flex items-center justify-center space-x-2 py-3 px-4 rounded-xl border text-base font-extrabold transition-all ${getBtnStyle('O')}">
            <i class="fa-regular fa-circle text-lg"></i>
            <span>正確 (O)</span>
          </button>
          <button onclick="handleAnswer('${q.id}', 'X')" ${isAnswered && currentMode === 'instant' ? 'disabled' : ''}
            class="flex items-center justify-center space-x-2 py-3 px-4 rounded-xl border text-base font-extrabold transition-all ${getBtnStyle('X')}">
            <i class="fa-solid fa-xmark text-lg"></i>
            <span>錯誤 (X)</span>
          </button>
        </div>
      `;
    }

    // 6.2 選擇題 (Multiple Choice)
    function buildMultipleChoiceButtons(q, state) {
      const isAnswered = state.isAnswered;
      const userChoice = state.userChoice;
      const letters = ['A', 'B', 'C', 'D'];

      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          ${q.options.map((opt, idx) => {
            let btnClass = "bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200";
            if (isAnswered) {
              if (currentMode === 'exam' && !state.showInExamReview) {
                btnClass = userChoice === idx ? "bg-indigo-600 text-white border-indigo-600 shadow-sm" : "bg-slate-50 text-slate-400 border-slate-200 opacity-60";
              } else {
                if (q.answer === idx) {
                  btnClass = "bg-emerald-500 text-white border-emerald-500 font-bold shadow-sm";
                } else if (userChoice === idx && !state.isCorrect) {
                  btnClass = "bg-rose-500 text-white border-rose-500 font-bold shadow-sm";
                } else {
                  btnClass = "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
                }
              }
            }

            return `
              <button onclick="handleAnswer('${q.id}', ${idx})" ${isAnswered && currentMode === 'instant' ? 'disabled' : ''}
                class="flex items-center text-left py-3 px-4 rounded-xl border transition-all text-sm sm:text-base font-medium ${btnClass}">
                <span class="w-6 h-6 rounded-lg bg-black/10 flex items-center justify-center text-xs font-bold mr-3 shrink-0">${letters[idx]}</span>
                <span class="flex-1">${opt}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    // 6.3 句子重組 (Unscramble Sentence)
    function buildUnscrambleInteractive(q, state) {
      if (!unscrambleDrafts[q.id]) {
        unscrambleDrafts[q.id] = [];
      }
      const draft = unscrambleDrafts[q.id];
      const availableWords = q.words.filter((_, idx) => !draft.includes(idx));

      return `
        <div>
          <div class="text-xs text-slate-500 mb-2 font-semibold">點擊單字卡片依序組成完整句子：</div>
          
          <!-- Answer Slot Area -->
          <div class="min-h-[52px] p-2.5 bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex flex-wrap gap-2 items-center mb-3">
            ${draft.length === 0 ? '<span class="text-xs text-slate-400 select-none">按順序點擊下方單字排列此處...</span>' : ''}
            ${draft.map((wordIdx, slotIdx) => `
              <button onclick="removeFromUnscramble('${q.id}', ${slotIdx})" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white text-xs sm:text-sm font-bold rounded-lg shadow-sm flex items-center space-x-1 transition-transform active:scale-95">
                <span>${q.words[wordIdx]}</span>
                <i class="fa-solid fa-xmark text-[10px] ml-1 opacity-70"></i>
              </button>
            `).join('')}
          </div>

          <!-- Word Bank Chips -->
          <div class="flex flex-wrap gap-2 mb-3">
            ${q.words.map((word, wIdx) => {
              const isUsed = draft.includes(wIdx);
              return `
                <button onclick="addToUnscramble('${q.id}', ${wIdx})" ${isUsed ? 'disabled' : ''}
                  class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold border transition-all ${isUsed ? 'bg-slate-100 text-slate-300 border-slate-200' : 'bg-white hover:bg-purple-50 text-slate-800 border-slate-300 hover:border-purple-300 shadow-sm'}">
                  ${word}
                </button>
              `;
            }).join('')}
          </div>

          <!-- Submit / Reset for Unscramble -->
          <div class="flex items-center space-x-2">
            <button onclick="checkUnscramble('${q.id}')" ${draft.length === 0 ? 'disabled' : ''}
              class="px-4 py-2 bg-purple-600 hover:bg-purple-700 disabled:bg-slate-200 disabled:text-slate-400 text-white text-xs sm:text-sm font-bold rounded-xl shadow-sm transition-all flex items-center space-x-1">
              <i class="fa-solid fa-check"></i>
              <span>檢查答案</span>
            </button>
            <button onclick="clearUnscramble('${q.id}')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs sm:text-sm font-semibold rounded-xl transition-colors">
              清空重選
            </button>
          </div>
        </div>
      `;
    }

    function addToUnscramble(qId, wordIdx) {
      playChime('click');
      if (!unscrambleDrafts[qId]) unscrambleDrafts[qId] = [];
      unscrambleDrafts[qId].push(wordIdx);
      renderQuestions();
    }

    function removeFromUnscramble(qId, slotIdx) {
      playChime('click');
      if (!unscrambleDrafts[qId]) return;
      unscrambleDrafts[qId].splice(slotIdx, 1);
      renderQuestions();
    }

    function clearUnscramble(qId) {
      playChime('click');
      unscrambleDrafts[qId] = [];
      renderQuestions();
    }

    function checkUnscramble(qId) {
      const q = engQuestions.find(item => item.id === qId);
      const draft = unscrambleDrafts[qId] || [];
      const userSentence = draft.map(i => q.words[i]).join(' ');
      const isCorrect = userSentence.trim() === q.correctSentence.trim();

      handleAnswer(qId, userSentence, isCorrect);
    }

    // 6.4 單字歸類 (Category Clicker)
    function buildCategoryInteractive(q, state) {
      if (!state.userClassify) {
        state.userClassify = {};
      }

      return `
        <div>
          <div class="text-xs text-slate-500 mb-2 font-medium">請點擊單字切換其正確所屬分類：</div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 mb-3">
            ${q.items.map((item, idx) => {
              const currentCat = state.userClassify[idx] || null;
              let catLabel = "尚未分類";
              let catColor = "bg-slate-100 text-slate-600 border-slate-200";

              if (currentCat === 'country') {
                catLabel = "國家 (Country)";
                catColor = "bg-amber-100 text-amber-800 border-amber-300 font-bold";
              } else if (currentCat === 'trans') {
                catLabel = "交通工具 (Transportation)";
                catColor = "bg-cyan-100 text-cyan-800 border-cyan-300 font-bold";
              }

              return `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex flex-col justify-between space-y-2">
                  <div class="font-extrabold text-sm text-slate-800">${item.word}</div>
                  <div class="flex space-x-1">
                    <button onclick="setClassifyWord('${q.id}', ${idx}, 'country')" class="flex-1 py-1 text-[11px] rounded-lg border font-semibold ${currentCat === 'country' ? 'bg-amber-600 text-white border-amber-600' : 'bg-white hover:bg-slate-100 text-slate-600'}">國家</button>
                    <button onclick="setClassifyWord('${q.id}', ${idx}, 'trans')" class="flex-1 py-1 text-[11px] rounded-lg border font-semibold ${currentCat === 'trans' ? 'bg-cyan-600 text-white border-cyan-600' : 'bg-white hover:bg-slate-100 text-slate-600'}">交通</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <button onclick="checkClassifyAnswer('${q.id}')" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow-sm transition-all">
            確認歸類答案
          </button>
        </div>
      `;
    }

    function setClassifyWord(qId, itemIdx, catType) {
      playChime('click');
      if (!answersState[qId]) {
        answersState[qId] = { isAnswered: false, userChoice: null, isCorrect: false, userClassify: {} };
      }
      if (!answersState[qId].userClassify) {
        answersState[qId].userClassify = {};
      }
      answersState[qId].userClassify[itemIdx] = catType;
      renderQuestions();
    }

    function checkClassifyAnswer(qId) {
      const q = engQuestions.find(item => item.id === qId);
      const userClassify = answersState[qId]?.userClassify || {};

      let allCorrect = true;
      for (let i = 0; i < q.items.length; i++) {
        if (userClassify[i] !== q.items[i].cat) {
          allCorrect = false;
          break;
        }
      }

      handleAnswer(qId, userClassify, allCorrect);
    }

    /* =====================================================================
       7. ANSWER HANDLING & STATS COMPUTATION
       ===================================================================== */
    function handleAnswer(questionId, choice, overrideCorrectness = null) {
      const dataset = getCurrentDataset();
      const q = dataset.find(item => item.id === questionId);
      if (!q) return;

      let isCorrect = false;
      if (overrideCorrectness !== null) {
        isCorrect = overrideCorrectness;
      } else {
        isCorrect = (q.answer === choice);
      }

      answersState[questionId] = {
        isAnswered: true,
        userChoice: choice,
        isCorrect: isCorrect,
        showInExamReview: currentMode === 'exam' ? false : true
      };

      if (currentMode === 'instant') {
        if (isCorrect) {
          playChime('correct');
        } else {
          playChime('wrong');
        }
      } else {
        playChime('click');
      }

      updateDashboardStats();
      renderQuestions();
    }

    function updateDashboardStats() {
      const dataset = getCurrentDataset();
      const total = dataset.length;
      let answered = 0;
      let correct = 0;
      let wrong = 0;

      dataset.forEach(q => {
        const state = answersState[q.id];
        if (state && state.isAnswered) {
          answered++;
          if (state.isCorrect) correct++;
          else wrong++;
        }
      });

      const accuracy = answered > 0 ? Math.round((correct / answered) * 100) : 0;
      const progressPercent = total > 0 ? (answered / total) * 100 : 0;

      document.getElementById('statAnswered').textContent = answered;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statCorrect').textContent = correct;
      document.getElementById('statWrong').textContent = wrong;
      document.getElementById('statAccuracy').textContent = `${accuracy}%`;
      document.getElementById('wrongCountBadge').textContent = wrong;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;
    }

    function resetCurrentQuiz() {
      const dataset = getCurrentDataset();
      dataset.forEach(q => {
        delete answersState[q.id];
        delete unscrambleDrafts[q.id];
      });
      playChime('click');
      updateDashboardStats();
      renderQuestions();
    }

    /* =====================================================================
       8. EXAM SUBMISSION & MODAL
       ===================================================================== */
    function submitExam() {
      const dataset = getCurrentDataset();
      let answeredCount = 0;
      let correctCount = 0;

      dataset.forEach(q => {
        const state = answersState[q.id];
        if (state && state.isAnswered) {
          answeredCount++;
          state.showInExamReview = true;
          if (state.isCorrect) correctCount++;
        }
      });

      const total = dataset.length;
      const finalScore = Math.round((correctCount / total) * 100);
      const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

      // Populate Modal
      document.getElementById('modalSubjectTag').textContent = currentSubject === 'math' ? '數學科測驗結算' : '生活英語測驗結算';
      document.getElementById('modalFinalScore').textContent = `${finalScore}分`;
      document.getElementById('modalCorrectCount').textContent = `${correctCount}/${total}`;
      document.getElementById('modalAccuracy').textContent = `${accuracy}%`;

      const titleElem = document.getElementById('modalScoreTitle');
      const iconElem = document.getElementById('modalScoreIcon');
      if (finalScore >= 90) {
        titleElem.textContent = "表現極度傑出！觀念掌握完美！";
        iconElem.innerHTML = '<i class="fa-solid fa-crown text-amber-500"></i>';
        playChime('correct');
      } else if (finalScore >= 70) {
        titleElem.textContent = "表現良好！複習錯題後能更上一層樓！";
        iconElem.innerHTML = '<i class="fa-solid fa-medal text-teal-500"></i>';
        playChime('correct');
      } else {
        titleElem.textContent = "加油！透過錯題觀念解析加強練習！";
        iconElem.innerHTML = '<i class="fa-solid fa-book-bookmark text-indigo-500"></i>';
        playChime('wrong');
      }

      document.getElementById('scoreReportModal').classList.remove('hidden');
    }

    function closeScoreReport(keepReview) {
      document.getElementById('scoreReportModal').classList.add('hidden');
      if (keepReview) {
        // Switch to instant display so answers & explanations are visible
        currentMode = 'instant';
        setQuizMode('instant');
      }
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* =====================================================================
       9. INITIALIZATION
       ===================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      renderCategoryButtons();
      renderQuestions();
      updateDashboardStats();
    });
  </script>
</body>
</html>
