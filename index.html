<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小多學科互動測驗學習平台</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-rose-500 selection:text-white">

  <!-- ================= 頂端導覽列 ================= -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 sm:h-20">
        
        <!-- Logo 與標題 -->
        <div class="flex items-center space-x-3">
          <div id="subjectIconWrapper" class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-rose-600 text-white flex items-center justify-center text-xl sm:text-2xl shadow-md transition-colors duration-300">
            <i id="subjectIcon" class="fa-solid fa-book"></i>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <span id="subjectBadge" class="text-xs px-2 py-0.5 rounded-full font-bold uppercase tracking-wider bg-rose-100 text-rose-800 transition-colors">國語科</span>
              <span class="text-xs text-slate-400 hidden sm:inline-block">互動題庫系統</span>
            </div>
            <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight">國小學科多元測驗系統</h1>
          </div>
        </div>

        <!-- 科目切換按鈕區 (由 JS 依序生成：國語科 -> 社會科 -> 數學科) -->
        <div id="subjectNavList" class="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200 shadow-inner overflow-x-auto gap-1"></div>

        <!-- 功能按鈕 -->
        <div class="flex items-center space-x-2">
          <button onclick="toggleAudio()" id="btnAudioToggle" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors" title="音效切換">
            <i id="audioIcon" class="fa-solid fa-volume-high"></i>
          </button>
          <button onclick="resetCurrentQuiz()" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center space-x-1 transition-colors" title="重設進度">
            <i class="fa-solid fa-rotate-left"></i>
            <span class="hidden md:inline">重測</span>
          </button>
        </div>

      </div>
    </div>

    <!-- 子工具列：分類篩選與測驗模式 -->
    <div class="bg-slate-50/90 border-t border-slate-200/80 px-4 sm:px-6 lg:px-8 py-2.5">
      <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 text-sm">
        
        <!-- 題型分類標籤 (由 JS 自動統計生成) -->
        <div id="filterButtonGroup" class="flex flex-wrap items-center gap-1.5 overflow-x-auto py-1"></div>

        <!-- 模式切換與錯題篩選 -->
        <div class="flex items-center space-x-3 ml-auto">
          <div class="flex items-center bg-white border border-slate-200 rounded-lg p-0.5 text-xs font-semibold shadow-sm">
            <button onclick="setQuizMode('instant')" id="modeInstantBtn" class="px-2.5 py-1.5 rounded-md bg-rose-600 text-white font-bold transition-all">
              <i class="fa-solid fa-bolt mr-1"></i>即時解析
            </button>
            <button onclick="setQuizMode('exam')" id="modeExamBtn" class="px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all">
              <i class="fa-solid fa-clipboard-check mr-1"></i>模擬考模式
            </button>
          </div>

          <button onclick="toggleFilterWrongOnly()" id="btnWrongFilter" class="px-2.5 py-1.5 rounded-lg border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold transition-all flex items-center space-x-1">
            <i class="fa-solid fa-filter"></i>
            <span>僅看錯題 (<span id="wrongCountBadge">0</span>)</span>
          </button>
        </div>

      </div>
    </div>

    <!-- 進度條 -->
    <div class="w-full bg-slate-200 h-1.5 relative overflow-hidden">
      <div id="progressBar" class="bg-rose-500 h-full w-0 transition-all duration-300"></div>
    </div>
  </header>

  <!-- ================= 統計面板 ================= -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 w-full">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3.5">
        <div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-list-ol"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-500">已作答 / 總題數</div>
          <div class="text-lg font-extrabold text-slate-900"><span id="statAnswered">0</span> / <span id="statTotal">0</span></div>
        </div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3.5">
        <div class="w-11 h-11 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-500">答對題數</div>
          <div class="text-lg font-extrabold text-emerald-600" id="statCorrect">0</div>
        </div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3.5">
        <div class="w-11 h-11 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-circle-xmark"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-500">答錯題數</div>
          <div class="text-lg font-extrabold text-rose-600" id="statWrong">0</div>
        </div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3.5">
        <div class="w-11 h-11 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-chart-pie"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-500">當前正確率</div>
          <div class="text-lg font-extrabold text-slate-900" id="statAccuracy">0%</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= 模擬考交卷列 ================= -->
  <section id="examSubmitSection" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 w-full hidden">
    <div class="bg-gradient-to-r from-rose-500 via-amber-500 to-teal-600 rounded-2xl p-5 text-white shadow-lg flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-3 bg-white/20 rounded-xl backdrop-blur-sm text-2xl">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <h2 class="text-lg font-bold">模擬考測驗進行中</h2>
          <p class="text-xs sm:text-sm text-white/90">作答時不會提示正誤，完成後請點選交卷查看總分與詳解！</p>
        </div>
      </div>
      <button onclick="submitExam()" class="w-full sm:w-auto px-6 py-3 bg-white text-rose-800 hover:bg-slate-100 font-extrabold rounded-xl shadow-md transition-all flex items-center justify-center space-x-2">
        <i class="fa-solid fa-paper-plane"></i>
        <span>完成交卷結算</span>
      </button>
    </div>
  </section>

  <!-- ================= 結算報告彈窗 ================= -->
  <div id="scoreReportModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 text-center transform transition-all scale-95 duration-200">
      <div class="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-inner mb-4 bg-rose-50 text-rose-600" id="modalScoreIcon">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <span class="text-xs uppercase font-extrabold tracking-widest text-rose-600 bg-rose-50 px-3 py-1 rounded-full" id="modalSubjectTag">測驗結算</span>
      <h3 class="text-2xl font-black text-slate-900 mt-2 mb-1" id="modalScoreTitle">測驗成果分析</h3>
      <p class="text-slate-500 text-sm mb-6">以下是您本次測驗的詳細成果報告：</p>

      <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 grid grid-cols-3 gap-2 mb-6">
        <div>
          <div class="text-xs text-slate-400 font-medium">總得分</div>
          <div class="text-2xl font-black text-rose-600 mt-1" id="modalFinalScore">0分</div>
        </div>
        <div>
          <div class="text-xs text-slate-400 font-medium">答對題數</div>
          <div class="text-2xl font-black text-emerald-600 mt-1" id="modalCorrectCount">0/0</div>
        </div>
        <div>
          <div class="text-xs text-slate-400 font-medium">正確率</div>
          <div class="text-2xl font-black text-indigo-600 mt-1" id="modalAccuracy">0%</div>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <button onclick="closeScoreReport(true)" class="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md transition-colors flex items-center justify-center space-x-2">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>檢視錯題與詳解</span>
        </button>
        <button onclick="closeScoreReport(false); resetCurrentQuiz();" class="py-3 px-5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">
          <i class="fa-solid fa-rotate-left mr-1"></i>重新測驗
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 題目列表容器 ================= -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1">
    <div id="emptyState" class="hidden bg-white rounded-3xl p-12 text-center border border-dashed border-slate-300">
      <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-slate-400 text-2xl mb-4">
        <i class="fa-solid fa-folder-open"></i>
      </div>
      <h3 class="text-lg font-bold text-slate-800">目前分類沒有相符的題目</h3>
      <p class="text-slate-500 text-sm mt-1">您可以切換上方分類，或是取消「僅看錯題」篩選。</p>
      <button onclick="clearFilters()" class="mt-4 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl">重置篩選</button>
    </div>

    <div id="questionContainer" class="space-y-5"></div>
  </main>

  <div class="fixed bottom-6 right-6 z-40 flex flex-col space-y-3">
    <button onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" class="w-12 h-12 bg-white/90 hover:bg-white text-slate-700 shadow-xl border border-slate-200 rounded-2xl flex items-center justify-center transition-all hover:scale-105 active:scale-95" title="回到頂部">
      <i class="fa-solid fa-arrow-up text-lg"></i>
    </button>
  </div>

  <footer class="bg-white border-t border-slate-200 py-6 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-400">
      <p>國小多元測驗系統 • 國語科、社會科與數學科題庫</p>
    </div>
  </footer>

  <!-- ================= 載入外部分離題庫 (國語 -> 社會 -> 數學) ================= -->
  <script src="./questions_chinese.js"></script>
  <script src="./questions_society.js"></script>
  <script src="./questions_math.js"></script>

  <!-- ================= 核心邏輯引擎 ================= -->
  <script>
    // 依序註冊：國語科 -> 社會科 -> 數學科
    const SUBJECT_CONFIG = {
      chi: {
        label: '國語科',
        icon: 'fa-book',
        theme: {
          activeBtn: 'bg-white text-rose-700 shadow-sm',
          inactiveBtn: 'text-slate-600 hover:text-rose-600',
          badge: 'bg-rose-100 text-rose-800',
          iconWrap: 'bg-rose-600 text-white',
          progress: 'bg-rose-500',
          modeBtn: 'bg-rose-600 text-white'
        },
        getData: () => window.chineseQuestions || []
      },
      soc: {
        label: '社會科',
        icon: 'fa-landmark',
        theme: {
          activeBtn: 'bg-white text-amber-700 shadow-sm',
          inactiveBtn: 'text-slate-600 hover:text-amber-600',
          badge: 'bg-amber-100 text-amber-800',
          iconWrap: 'bg-amber-600 text-white',
          progress: 'bg-amber-500',
          modeBtn: 'bg-amber-600 text-white'
        },
        getData: () => window.societyQuestions || []
      },
      math: {
        label: '數學科',
        icon: 'fa-calculator',
        theme: {
          activeBtn: 'bg-white text-teal-700 shadow-sm',
          inactiveBtn: 'text-slate-600 hover:text-teal-600',
          badge: 'bg-teal-100 text-teal-800',
          iconWrap: 'bg-teal-600 text-white',
          progress: 'bg-teal-500',
          modeBtn: 'bg-teal-600 text-white'
        },
        getData: () => window.mathQuestions || []
      }
    };

    // 預設進入國語科
    let currentSubject = 'chi';
    let currentMode = 'instant';
    let currentCategory = 'all';
    let filterWrongOnly = false;
    let audioEnabled = true;
    const answersState = {};

    function getCurrentDataset() {
      const config = SUBJECT_CONFIG[currentSubject];
      return config ? config.getData() : [];
    }

    function renderSubjectNav() {
      const navContainer = document.getElementById('subjectNavList');
      navContainer.innerHTML = '';

      Object.keys(SUBJECT_CONFIG).forEach(key => {
        const item = SUBJECT_CONFIG[key];
        const isActive = currentSubject === key;
        const btn = document.createElement('button');
        btn.onclick = () => switchSubject(key);
        btn.className = `flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all shrink-0 ${
          isActive ? item.theme.activeBtn : item.theme.inactiveBtn
        }`;
        btn.innerHTML = `<i class="fa-solid ${item.icon}"></i><span>${item.label}</span>`;
        navContainer.appendChild(btn);
      });
    }

    function switchSubject(subjectKey) {
      if (!SUBJECT_CONFIG[subjectKey]) return;
      currentSubject = subjectKey;
      currentCategory = 'all';
      filterWrongOnly = false;
      playChime('click');

      const config = SUBJECT_CONFIG[subjectKey];
      document.getElementById('subjectBadge').textContent = config.label;
      document.getElementById('subjectBadge').className = `text-xs px-2 py-0.5 rounded-full font-bold uppercase tracking-wider transition-colors ${config.theme.badge}`;
      document.getElementById('subjectIconWrapper').className = `w-10 h-10 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center text-xl sm:text-2xl shadow-md transition-colors duration-300 ${config.theme.iconWrap}`;
      document.getElementById('subjectIcon').className = `fa-solid ${config.icon}`;
      document.getElementById('progressBar').className = `h-full w-0 transition-all duration-300 ${config.theme.progress}`;

      if (currentMode === 'instant') {
        document.getElementById('modeInstantBtn').className = `px-2.5 py-1.5 rounded-md font-bold transition-all ${config.theme.modeBtn}`;
      }

      renderSubjectNav();
      renderCategoryButtons();
      renderQuestions();
      updateDashboardStats();
    }

    function renderCategoryButtons() {
      const container = document.getElementById('filterButtonGroup');
      container.innerHTML = '';
      const list = getCurrentDataset();

      const catCounts = {};
      list.forEach(q => { catCounts[q.category] = (catCounts[q.category] || 0) + 1; });

      const catLabels = {
        tf: '是非題', choice: '選擇題', phonetic: '字音字形',
        vocabulary: '字詞義運用', punctuation: '標點符號',
        rhetoric: '基本修辭', idiom: '延伸成語', other: '句型與綜合'
      };

      const categories = [{ key: 'all', label: '全部題目', count: list.length }];
      Object.keys(catCounts).forEach(catKey => {
        categories.push({ key: catKey, label: catLabels[catKey] || catKey, count: catCounts[catKey] });
      });

      categories.forEach(cat => {
        const btn = document.createElement('button');
        const isActive = currentCategory === cat.key;
        btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 shrink-0 ${
          isActive ? 'bg-slate-800 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
        }`;
        btn.innerHTML = `<span>${cat.label}</span><span class="text-[10px] px-1.5 py-0.2 rounded-full ${isActive ? 'bg-white/20' : 'bg-slate-100'}">${cat.count}</span>`;
        btn.onclick = () => {
          currentCategory = cat.key;
          filterWrongOnly = false;
          playChime('click');
          renderCategoryButtons();
          renderQuestions();
        };
        container.appendChild(btn);
      });
    }

    function renderQuestions() {
      const container = document.getElementById('questionContainer');
      const emptyState = document.getElementById('emptyState');
      const rawList = getCurrentDataset();

      let list = rawList;
      if (currentCategory !== 'all') list = list.filter(q => q.category === currentCategory);
      if (filterWrongOnly) list = list.filter(q => answersState[q.id] && answersState[q.id].isAnswered && !answersState[q.id].isCorrect);

      container.innerHTML = '';
      if (list.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      list.forEach((q, index) => {
        const state = answersState[q.id] || { isAnswered: false, userChoice: null, isCorrect: false };
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200/90 p-5 sm:p-6 shadow-sm hover:shadow-md transition-all";

        const isTf = q.type === 'tf';
        const typeBadge = isTf 
          ? `<span class="bg-blue-50 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-md border border-blue-200/60">是非題</span>`
          : `<span class="bg-purple-50 text-purple-700 text-xs font-bold px-2 py-0.5 rounded-md border border-purple-200/60">選擇題</span>`;

        let contextHtml = q.context ? `
          <div class="mb-3 p-3.5 bg-slate-50 border-l-4 border-indigo-400 rounded-r-xl text-slate-700 text-sm leading-relaxed">
            <div class="text-[11px] font-bold text-indigo-500 uppercase tracking-wider mb-1 flex items-center">
              <i class="fa-solid fa-book-open mr-1"></i> 題組材料 / 短文說明
            </div>
            ${q.context}
          </div>` : '';

        let interactiveBody = '';
        if (isTf) {
          const getBtnStyle = (val) => {
            if (!state.isAnswered) return "bg-slate-50 hover:bg-slate-100 text-slate-800 border-slate-200";
            if (currentMode === 'exam' && !state.showInExamReview) return state.userChoice === val ? "bg-indigo-600 text-white border-indigo-600 shadow-md" : "bg-slate-50 text-slate-400 border-slate-200 opacity-60";
            if (q.answer === val) return "bg-emerald-500 text-white border-emerald-500 font-bold shadow-md";
            if (state.userChoice === val && !state.isCorrect) return "bg-rose-500 text-white border-rose-500 font-bold shadow-md";
            return "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
          };
          interactiveBody = `
            <div class="grid grid-cols-2 gap-3 sm:max-w-md">
              <button onclick="handleAnswer('${q.id}', 'O')" ${state.isAnswered && currentMode === 'instant' ? 'disabled' : ''} class="flex items-center justify-center space-x-2 py-3 px-4 rounded-xl border text-base font-extrabold transition-all ${getBtnStyle('O')}">
                <i class="fa-regular fa-circle text-lg"></i><span>正確 (○)</span>
              </button>
              <button onclick="handleAnswer('${q.id}', 'X')" ${state.isAnswered && currentMode === 'instant' ? 'disabled' : ''} class="flex items-center justify-center space-x-2 py-3 px-4 rounded-xl border text-base font-extrabold transition-all ${getBtnStyle('X')}">
                <i class="fa-solid fa-xmark text-lg"></i><span>錯誤 (╳)</span>
              </button>
            </div>`;
        } else {
          const letters = ['A', 'B', 'C', 'D'];
          interactiveBody = `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${(q.options || []).map((opt, idx) => {
                let btnClass = "bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200";
                if (state.isAnswered) {
                  if (currentMode === 'exam' && !state.showInExamReview) {
                    btnClass = state.userChoice === idx ? "bg-indigo-600 text-white border-indigo-600 shadow-sm" : "bg-slate-50 text-slate-400 border-slate-200 opacity-60";
                  } else {
                    if (q.answer === idx) btnClass = "bg-emerald-500 text-white border-emerald-500 font-bold shadow-sm";
                    else if (state.userChoice === idx && !state.isCorrect) btnClass = "bg-rose-500 text-white border-rose-500 font-bold shadow-sm";
                    else btnClass = "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
                  }
                }
                return `
                  <button onclick="handleAnswer('${q.id}', ${idx})" ${state.isAnswered && currentMode === 'instant' ? 'disabled' : ''} class="flex items-center text-left py-3 px-4 rounded-xl border transition-all text-sm sm:text-base font-medium ${btnClass}">
                    <span class="w-6 h-6 rounded-lg bg-black/10 flex items-center justify-center text-xs font-bold mr-3 shrink-0">${letters[idx] || (idx+1)}</span>
                    <span class="flex-1">${opt}</span>
                  </button>`;
              }).join('')}
            </div>`;
        }

        const showExp = state.isAnswered && (currentMode === 'instant' || state.showInExamReview);
        const expHtml = showExp ? `
          <div class="mt-4 p-4 rounded-xl border ${state.isCorrect ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-rose-700 bg-rose-50 border-rose-200'} text-sm">
            <div class="font-bold flex items-center space-x-1.5 mb-1">
              <i class="fa-solid ${state.isCorrect ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'}"></i>
              <span>${state.isCorrect ? '回答正確！' : '回答錯誤！'}</span>
            </div>
            ${q.explanation ? `<div class="text-slate-600 text-xs sm:text-sm mt-1"><strong class="text-slate-700">解析說明：</strong> ${q.explanation}</div>` : ''}
          </div>` : '';

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3 mb-2">
            <div class="flex items-center space-x-2">
              <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-700 font-extrabold text-xs flex items-center justify-center">${index + 1}</span>
              ${typeBadge}
            </div>
            ${state.isAnswered ? `
              <span class="text-xs font-bold px-2.5 py-1 rounded-full ${state.isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                ${state.isCorrect ? '<i class="fa-solid fa-check mr-1"></i>答對' : '<i class="fa-solid fa-xmark mr-1"></i>答錯'}
              </span>` : ''}
          </div>
          ${contextHtml}
          <div class="text-base sm:text-lg font-bold text-slate-900 leading-snug my-2">${q.question}</div>
          <div class="mt-4">${interactiveBody}</div>
          ${expHtml}`;
        container.appendChild(card);
      });
    }

    function handleAnswer(questionId, choice) {
      const q = getCurrentDataset().find(item => item.id === questionId);
      if (!q) return;

      const isCorrect = (q.answer === choice);
      answersState[questionId] = {
        isAnswered: true,
        userChoice: choice,
        isCorrect: isCorrect,
        showInExamReview: currentMode !== 'exam'
      };

      playChime(currentMode === 'instant' ? (isCorrect ? 'correct' : 'wrong') : 'click');
      updateDashboardStats();
      renderQuestions();
    }

    function updateDashboardStats() {
      const dataset = getCurrentDataset();
      let answered = 0, correct = 0, wrong = 0;

      dataset.forEach(q => {
        const state = answersState[q.id];
        if (state && state.isAnswered) {
          answered++;
          if (state.isCorrect) correct++; else wrong++;
        }
      });

      const total = dataset.length;
      document.getElementById('statAnswered').textContent = answered;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statCorrect').textContent = correct;
      document.getElementById('statWrong').textContent = wrong;
      document.getElementById('statAccuracy').textContent = `${answered > 0 ? Math.round((correct / answered) * 100) : 0}%`;
      document.getElementById('wrongCountBadge').textContent = wrong;
      document.getElementById('progressBar').style.width = `${total > 0 ? (answered / total) * 100 : 0}%`;
    }

    function toggleFilterWrongOnly() {
      filterWrongOnly = !filterWrongOnly;
      playChime('click');
      const btn = document.getElementById('btnWrongFilter');
      btn.className = filterWrongOnly
        ? 'px-2.5 py-1.5 rounded-lg border border-rose-500 bg-rose-600 text-white text-xs font-bold transition-all flex items-center space-x-1'
        : 'px-2.5 py-1.5 rounded-lg border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold transition-all flex items-center space-x-1';
      renderQuestions();
    }

    function clearFilters() {
      currentCategory = 'all';
      filterWrongOnly = false;
      document.getElementById('btnWrongFilter').className = 'px-2.5 py-1.5 rounded-lg border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold transition-all flex items-center space-x-1';
      renderCategoryButtons();
      renderQuestions();
    }

    function setQuizMode(mode) {
      currentMode = mode;
      playChime('click');
      const config = SUBJECT_CONFIG[currentSubject];
      document.getElementById('modeInstantBtn').className = mode === 'instant' 
        ? `px-2.5 py-1.5 rounded-md font-bold transition-all ${config ? config.theme.modeBtn : 'bg-rose-600 text-white'}` 
        : 'px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all';
      document.getElementById('modeExamBtn').className = mode === 'exam' 
        ? 'px-2.5 py-1.5 rounded-md bg-indigo-600 text-white font-bold transition-all' 
        : 'px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all';
      document.getElementById('examSubmitSection').classList.toggle('hidden', mode === 'instant');
      renderQuestions();
      updateDashboardStats();
    }

    function resetCurrentQuiz() {
      getCurrentDataset().forEach(q => delete answersState[q.id]);
      playChime('click');
      updateDashboardStats();
      renderQuestions();
    }

    function submitExam() {
      let correctCount = 0, answeredCount = 0;
      const dataset = getCurrentDataset();
      dataset.forEach(q => {
        const state = answersState[q.id];
        if (state && state.isAnswered) {
          answeredCount++;
          state.showInExamReview = true;
          if (state.isCorrect) correctCount++;
        }
      });

      const total = dataset.length;
      const finalScore = total > 0 ? Math.round((correctCount / total) * 100) : 0;
      document.getElementById('modalSubjectTag').textContent = `${SUBJECT_CONFIG[currentSubject]?.label || '科目'}結算`;
      document.getElementById('modalFinalScore').textContent = `${finalScore}分`;
      document.getElementById('modalCorrectCount').textContent = `${correctCount}/${total}`;
      document.getElementById('modalAccuracy').textContent = `${answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0}%`;

      const titleElem = document.getElementById('modalScoreTitle');
      const iconElem = document.getElementById('modalScoreIcon');
      if (finalScore >= 90) {
        titleElem.textContent = "表現極度傑出！掌握非常完美！";
        iconElem.innerHTML = '<i class="fa-solid fa-crown text-amber-500"></i>';
      } else if (finalScore >= 70) {
        titleElem.textContent = "表現良好！複習錯題後能更上一層樓！";
        iconElem.innerHTML = '<i class="fa-solid fa-medal text-teal-500"></i>';
      } else {
        titleElem.textContent = "再接再厲！觀看解析強化觀念！";
        iconElem.innerHTML = '<i class="fa-solid fa-book-bookmark text-indigo-500"></i>';
      }
      playChime(finalScore >= 70 ? 'correct' : 'wrong');
      document.getElementById('scoreReportModal').classList.remove('hidden');
    }

    function closeScoreReport(keepReview) {
      document.getElementById('scoreReportModal').classList.add('hidden');
      if (keepReview) setQuizMode('instant');
    }

    let audioCtx = null;
    function playChime(type) {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(185.00, now);
          osc.frequency.exponentialRampToValueAtTime(155.56, now + 0.15);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.31);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch (e) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audioIcon').className = audioEnabled ? 'fa-solid fa-volume-high text-teal-600' : 'fa-solid fa-volume-xmark text-slate-400';
    }

    function bootstrap() {
      renderSubjectNav();
      renderCategoryButtons();
      renderQuestions();
      updateDashboardStats();

      // 安全重試機制：若外部腳本有微幅網路延遲，120ms 後再次刷新確保資料到位
      if (getCurrentDataset().length === 0) {
        setTimeout(() => {
          renderCategoryButtons();
          renderQuestions();
          updateDashboardStats();
        }, 120);
      }
    }

    window.addEventListener('DOMContentLoaded', bootstrap);
  </script>
</body>
</html>
