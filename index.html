<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小多學科互動測驗學習平台 (數學 / 英文 / 國語 / 社會)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-teal-500 selection:text-white">

  <!-- ================= TOP NAVIGATION ================= -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm transition-all duration-300" id="headerNav">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 sm:h-20">
        
        <!-- Logo & Title -->
        <div class="flex items-center space-x-3">
          <div id="subjectIconWrapper" class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-purple-600 text-white flex items-center justify-center text-xl sm:text-2xl shadow-md transition-colors duration-300">
            <i id="subjectIcon" class="fa-solid fa-language"></i>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <span id="subjectBadge" class="text-xs px-2 py-0.5 rounded-full font-bold uppercase tracking-wider bg-purple-100 text-purple-800 transition-colors">英語科</span>
              <span class="text-xs text-slate-400 hidden sm:inline-block">互動題庫系統</span>
            </div>
            <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight">國小學科多元測驗系統</h1>
          </div>
        </div>

        <!-- Subject Switch Tabs (4 Subjects) -->
        <div class="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200 shadow-inner overflow-x-auto">
          <button id="btnSwitchEng" onclick="switchSubject('eng')" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all bg-white text-purple-700 shadow-sm shrink-0">
            <i class="fa-solid fa-language"></i>
            <span>英語科</span>
          </button>
          <button id="btnSwitchMath" onclick="switchSubject('math')" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all text-slate-600 hover:text-teal-600 shrink-0">
            <i class="fa-solid fa-calculator"></i>
            <span>數學科</span>
          </button>
          <button id="btnSwitchChi" onclick="switchSubject('chi')" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all text-slate-600 hover:text-rose-600 shrink-0">
            <i class="fa-solid fa-book"></i>
            <span>國語科</span>
          </button>
          <button id="btnSwitchSoc" onclick="switchSubject('soc')" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all text-slate-600 hover:text-amber-600 shrink-0">
            <i class="fa-solid fa-landmark"></i>
            <span>社會科</span>
          </button>
        </div>

        <!-- Utility buttons -->
        <div class="flex items-center space-x-2">
          <button onclick="toggleAudio()" id="btnAudioToggle" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors" title="音效切換">
            <i id="audioIcon" class="fa-solid fa-volume-high"></i>
          </button>
          <button onclick="resetCurrentQuiz()" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center space-x-1 transition-colors" title="重設進度">
            <i class="fa-solid fa-rotate-left"></i>
            <span class="hidden md:inline">重測</span>
          </button>
        </div>

      </div>
    </div>

    <!-- Sub-bar: Modes & Category Filters -->
    <div class="bg-slate-50/90 border-t border-slate-200/80 px-4 sm:px-6 lg:px-8 py-2.5">
      <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 text-sm">
        
        <!-- Filter Tabs -->
        <div id="filterButtonGroup" class="flex flex-wrap items-center gap-1.5 overflow-x-auto py-1"></div>

        <!-- Mode Selector & Stats Indicator -->
        <div class="flex items-center space-x-3 ml-auto">
          <!-- Mode Toggle -->
          <div class="flex items-center bg-white border border-slate-200 rounded-lg p-0.5 text-xs font-semibold shadow-sm">
            <button onclick="setQuizMode('instant')" id="modeInstantBtn" class="px-2.5 py-1.5 rounded-md bg-purple-600 text-white transition-all">
              <i class="fa-solid fa-bolt mr-1"></i>即時解析
            </button>
            <button onclick="setQuizMode('exam')" id="modeExamBtn" class="px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all">
              <i class="fa-solid fa-clipboard-check mr-1"></i>模擬考模式
            </button>
          </div>

          <!-- Wrong Only Filter -->
          <button onclick="toggleFilterWrongOnly()" id="btnWrongFilter" class="px-2.5 py-1.5 rounded-lg border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold transition-all flex items-center space-x-1">
            <i class="fa-solid fa-filter"></i>
            <span>僅看錯題 (<span id="wrongCountBadge">0</span>)</span>
          </button>
        </div>

      </div>
    </div>

    <!-- Quiz Progress Bar -->
    <div class="w-full bg-slate-200 h-1.5 relative overflow-hidden">
      <div id="progressBar" class="bg-purple-500 h-full w-0 transition-all duration-300"></div>
    </div>
  </header>

  <!-- ================= STATS SUMMARY BANNER ================= -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 w-full">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3.5">
        <div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-list-ol"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-500">已作答 / 總題數</div>
          <div class="text-lg font-extrabold text-slate-900"><span id="statAnswered">0</span> / <span id="statTotal">0</span></div>
        </div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3.5">
        <div class="w-11 h-11 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-500">答對題數</div>
          <div class="text-lg font-extrabold text-emerald-600" id="statCorrect">0</div>
        </div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3.5">
        <div class="w-11 h-11 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-circle-xmark"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-500">答錯題數</div>
          <div class="text-lg font-extrabold text-rose-600" id="statWrong">0</div>
        </div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3.5">
        <div class="w-11 h-11 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-chart-pie"></i>
        </div>
        <div>
          <div class="text-xs font-medium text-slate-500">當前正確率</div>
          <div class="text-lg font-extrabold text-slate-900" id="statAccuracy">0%</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= EXAM SUBMISSION BANNER (EXAM MODE ONLY) ================= -->
  <section id="examSubmitSection" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 w-full hidden">
    <div class="bg-gradient-to-r from-indigo-500 via-purple-600 to-teal-600 rounded-2xl p-5 text-white shadow-lg flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-3 bg-white/20 rounded-xl backdrop-blur-sm text-2xl">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <h2 class="text-lg font-bold">模擬考測驗進行中</h2>
          <p class="text-xs sm:text-sm text-white/90">作答時不會提示正誤，完成後請點選交卷查看總分與詳解！</p>
        </div>
      </div>
      <button onclick="submitExam()" class="w-full sm:w-auto px-6 py-3 bg-white text-indigo-700 hover:bg-slate-100 font-extrabold rounded-xl shadow-md transition-all flex items-center justify-center space-x-2">
        <i class="fa-solid fa-paper-plane"></i>
        <span>完成交卷結算</span>
      </button>
    </div>
  </section>

  <!-- ================= SCORE REPORT MODAL ================= -->
  <div id="scoreReportModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 text-center transform transition-all scale-95 duration-200">
      <div class="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-inner mb-4 bg-purple-50 text-purple-600" id="modalScoreIcon">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <span class="text-xs uppercase font-extrabold tracking-widest text-purple-600 bg-purple-50 px-3 py-1 rounded-full" id="modalSubjectTag">測驗結算</span>
      <h3 class="text-2xl font-black text-slate-900 mt-2 mb-1" id="modalScoreTitle">測驗成果分析</h3>
      <p class="text-slate-500 text-sm mb-6" id="modalScoreSubtitle">以下是您本次測驗的詳細成果報告：</p>

      <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 grid grid-cols-3 gap-2 mb-6">
        <div>
          <div class="text-xs text-slate-400 font-medium">總得分</div>
          <div class="text-2xl font-black text-purple-600 mt-1" id="modalFinalScore">0分</div>
        </div>
        <div>
          <div class="text-xs text-slate-400 font-medium">答對題數</div>
          <div class="text-2xl font-black text-emerald-600 mt-1" id="modalCorrectCount">0/0</div>
        </div>
        <div>
          <div class="text-xs text-slate-400 font-medium">正確率</div>
          <div class="text-2xl font-black text-indigo-600 mt-1" id="modalAccuracy">0%</div>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <button onclick="closeScoreReport(true)" class="flex-1 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition-colors flex items-center justify-center space-x-2">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>檢視錯題與詳解</span>
        </button>
        <button onclick="closeScoreReport(false); resetCurrentQuiz();" class="py-3 px-5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">
          <i class="fa-solid fa-rotate-left mr-1"></i>重新測驗
        </button>
      </div>
    </div>
  </div>

  <!-- ================= MAIN QUESTION LIST CONTAINER ================= -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1">
    
    <div id="emptyState" class="hidden bg-white rounded-3xl p-12 text-center border border-dashed border-slate-300">
      <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-slate-400 text-2xl mb-4">
        <i class="fa-solid fa-folder-open"></i>
      </div>
      <h3 class="text-lg font-bold text-slate-800">目前分類沒有相符的題目</h3>
      <p class="text-slate-500 text-sm mt-1">您可以切換上方分類，或是取消「僅看錯題」篩選。</p>
      <button onclick="clearFilters()" class="mt-4 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl">重置篩選</button>
    </div>

    <!-- Question Cards List -->
    <div id="questionContainer" class="space-y-5"></div>

  </main>

  <div class="fixed bottom-6 right-6 z-40 flex flex-col space-y-3">
    <button onclick="scrollToTop()" class="w-12 h-12 bg-white/90 hover:bg-white text-slate-700 shadow-xl border border-slate-200 rounded-2xl flex items-center justify-center transition-all hover:scale-105 active:scale-95" title="回到頂部">
      <i class="fa-solid fa-arrow-up text-lg"></i>
    </button>
  </div>

  <footer class="bg-white border-t border-slate-200 py-6 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-400">
      <p>國小全學科互動測驗系統 • 數學、生活英語、國語完整合輯與社會科題庫</p>
    </div>
  </footer>

  <!-- ================= EMBEDDED DATABASES & SCRIPTS ================= -->
  <script>
    /* ==========================================
       1. ENGLISH QUESTIONS (生活英語完整題庫)
       ========================================== */
    const engQuestions = [
      {
        id: "eng_cat_1",
        type: "category_drop",
        category: "grammar",
        question: "Look and Classify: 請將單字正確歸類到【國家 Countries】或【交通方式 Transportation】",
        items: [
          { word: "India", cat: "country" },
          { word: "on foot", cat: "trans" },
          { word: "Japan", cat: "country" },
          { word: "by bus", cat: "trans" },
          { word: "Australia", cat: "country" },
          { word: "by scooter", cat: "trans" }
        ],
        explanation: "國家 (Countries): India, Japan, Australia；交通方式 (Transportation): on foot, by bus, by scooter。"
      },
      {
        id: "eng_mc_1",
        type: "choice",
        category: "grammar",
        question: "How ＿＿＿＿ your sisters go to the park?",
        options: ["is", "are", "do", "does"],
        answer: 2,
        explanation: "主詞是複數名詞「your sisters」，句中有一般動詞「go」，故助動詞使用「do」。"
      },
      {
        id: "eng_mc_2",
        type: "choice",
        category: "grammar",
        question: "A: Does he go to school by bus?  B: No, he doesn't. He goes to school ＿＿＿＿.",
        options: ["by foot", "on foot", "with walk", "foot"],
        answer: 1,
        explanation: "英語中「步行、走路」的習慣固定片語為「on foot」。"
      },
      {
        id: "eng_mc_3",
        type: "choice",
        category: "grammar",
        question: "Look at the wrestler image. A: Where is he from?  B: ＿＿＿＿",
        options: ["He's from the UK.", "He's from Japan.", "He's from India.", "He's from Australia."],
        answer: 1,
        explanation: "相撲選手為日本特色，故回答「He's from Japan.」"
      },
      {
        id: "eng_mc_4",
        type: "choice",
        category: "grammar",
        question: "A: ＿＿＿＿＿＿＿＿?  B: I go to school by metro.",
        options: ["Where do you go?", "How do you go to school?", "When do you go to school?", "Do you go to school?"],
        answer: 1,
        explanation: "答句提供交通方式「by metro」，問句應使用「How do you go to school?」。"
      },
      {
        id: "eng_mc_5",
        type: "choice",
        category: "grammar",
        question: "完成句子：你妹妹走路去上學嗎？ ＿＿＿＿ your sister ＿＿＿＿ to school on foot?",
        options: ["Do / go", "Does / go", "Does / goes", "Is / going"],
        answer: 1,
        explanation: "主詞「your sister」為第三人稱單數，助動詞使用 Does，後面動詞恢復原形 go。"
      },
      {
        id: "eng_scramble_1",
        type: "unscramble",
        category: "unscramble",
        question: "句子重組 (Unscramble the sentence):",
        words: ["He", "goes", "to", "the", "bank", "by", "bike", "."],
        correctSentence: "He goes to the bank by bike .",
        explanation: "主詞 He + 動詞 goes + 目的地 to the bank + 交通方式 by bike."
      },
      {
        id: "eng_scramble_2",
        type: "unscramble",
        category: "unscramble",
        question: "句子重組 (Unscramble the question):",
        words: ["How", "do", "they", "go", "to", "the", "library", "?"],
        correctSentence: "How do they go to the library ?",
        explanation: "疑問詞 How + 助動詞 do + 主詞 they + 動詞 go to the library?"
      },
      {
        id: "eng_scramble_3",
        type: "unscramble",
        category: "unscramble",
        question: "句子重組 (Unscramble the sentence):",
        words: ["We", "are", "from", "the", "USA", "."],
        correctSentence: "We are from the USA .",
        explanation: "主詞 We + be動詞 are + 來自片語 from the USA."
      },
      {
        id: "eng_scramble_4",
        type: "unscramble",
        category: "unscramble",
        question: "句子重組 (Unscramble the question):",
        words: ["Is", "Jay", "from", "Singapore", "?"],
        correctSentence: "Is Jay from Singapore ?",
        explanation: "Be動詞開頭問句：Is + 主詞 Jay + 介系詞片語 from Singapore?"
      },
      {
        id: "eng_cloze_1",
        type: "choice",
        category: "reading",
        context: "Jenny (1) from Taiwan, but now she lives with her mom and dad in the USA. Now, she (2) two good friends at school. (3) Ian and Willy. They all like hamburgers.",
        question: "選出短文 (1) 處最適合的動詞：",
        options: ["am", "are", "is"],
        answer: 2,
        explanation: "主詞 Jenny 為第三人稱單數，be 動詞使用 is。"
      },
      {
        id: "eng_cloze_2",
        type: "choice",
        category: "reading",
        context: "Jenny is from Taiwan... Now, she (2) two good friends at school.",
        question: "選出短文 (2) 處正確的動詞形式：",
        options: ["have", "has", "is"],
        answer: 1,
        explanation: "主詞 she 為第三人稱單數，動詞擁有使用 has。"
      },
      {
        id: "eng_read_1",
        type: "choice",
        category: "reading",
        context: "Nick is a singer in the USA, but he is from Spain. He has many followers on Instagram: Singapore (170,901), India (320,500), Taiwan (450,200).",
        question: "Where is Nick from?",
        options: ["He is from the USA.", "He is from Spain.", "He is from the UK."],
        answer: 1,
        explanation: "文章明確提到「...but he is from Spain.」"
      },
      {
        id: "eng_read_2",
        type: "choice",
        category: "reading",
        context: "Followers: Singapore (170,901), India (320,500), Taiwan (450,200).",
        question: "There are 170,901 followers from one country. What country is this?",
        options: ["It is India.", "It is Taiwan.", "It is Singapore."],
        answer: 2,
        explanation: "數據中 170,901 人來自新加坡 (Singapore)。"
      },
      {
        id: "eng_read_3",
        type: "choice",
        category: "reading",
        context: "SpongeBob is from the USA, and Dora likes it very much. Detective Conan and Pokémon are from Japan. Peppa Pig is from the UK.",
        question: "Where is SpongeBob from?",
        options: ["It's from Japan.", "It's from the UK.", "It's from the USA."],
        answer: 2,
        explanation: "文中指出「SpongeBob is from the USA」。"
      },
      {
        id: "eng_read_4",
        type: "choice",
        category: "reading",
        context: "Detective Conan and Pokémon are from Japan. They're very popular in Taiwan. Peppa Pig is from the UK.",
        question: "Is Detective Conan from Japan?",
        options: ["No. It's from the UK.", "Yes, and Pokémon is from Japan, too.", "Yes, and Peppa Pig is from Japan, too."],
        answer: 1,
        explanation: "Detective Conan 和 Pokémon 均來自日本。"
      },
      {
        id: "eng_read_5",
        type: "choice",
        category: "reading",
        context: "D Zoo: 5 minutes walk from D Zoo Station by MRT, or 8 minutes walk from the dock by boat. Buses available: 101, 1056, 208, 399.",
        question: "Martin wants to go to the zoo by bus. Which bus can he take?",
        options: ["He can't go to the zoo by bus.", "He can take bus 101.", "He can take bus 988."],
        answer: 1,
        explanation: "提供之公車路線包含 101, 1056, 208, 399。"
      },
      {
        id: "eng_read_6",
        type: "choice",
        category: "reading",
        context: "D Zoo: 8 minutes walk from the dock (碼頭) by boat.",
        question: "Can people go to the zoo by boat?",
        options: ["Yes, they can go to the zoo by boat.", "No, they can only go by train.", "No, they can't."],
        answer: 0,
        explanation: "文中載明可從碼頭步行抵達，故可搭乘船隻 (boat) 前往。"
      },
      {
        id: "eng_read_7",
        type: "choice",
        category: "reading",

    let audioCtx = null;
    function playChime(type) {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.08);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(185.00, now);
          osc.frequency.exponentialRampToValueAtTime(155.56, now + 0.15);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.31);
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch (e) {}
    }

    function buildTrueFalseButtons(q, state) {
      const isAnswered = state.isAnswered;

        if (currentMode === 'exam' && !state.showInExamReview) {
          return userChoice === val ? "bg-indigo-600 text-white border-indigo-600 shadow-md" : "bg-slate-50 text-slate-400 border-slate-200 opacity-60";
        }
        if (q.answer === val) return "bg-emerald-500 text-white border-emerald-500 font-bold shadow-md";
        if (userChoice === val && !state.isCorrect) return "bg-rose-500 text-white border-rose-500 font-bold shadow-md";
        return "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
      };

      return `
        <div class="grid grid-cols-2 gap-3 sm:max-w-md">
          <button onclick="handleAnswer('${q.id}', 'O')" ${isAnswered && currentMode === 'instant' ? 'disabled' : ''}

            <span>正確 (O)</span>
          </button>
          <button onclick="handleAnswer('${q.id}', 'X')" ${isAnswered && currentMode === 'instant' ? 'disabled' : ''}
            class="flex items-center justify-center space-x-2 py-3 px-4 rounded-xl border text-base font-extrabold transition-all ${getBtnStyle('X')}">

      const letters = ['A', 'B', 'C', 'D'];

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          ${q.options.map((opt, idx) => {
            let btnClass = "bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200";
            if (isAnswered) {
              if (currentMode === 'exam' && !state.showInExamReview) {

                  btnClass = "bg-emerald-500 text-white border-emerald-500 font-bold shadow-sm";
                } else if (userChoice === idx && !state.isCorrect) {
                  btnClass = "bg-rose-500 text-white border-rose-500 font-bold shadow-sm";
                } else {
                  btnClass = "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
                }
              }
            }

            return `
              <button onclick="handleAnswer('${q.id}', ${idx})" ${isAnswered && currentMode === 'instant' ? 'disabled' : ''}
                class="flex items-center text-left py-3 px-4 rounded-xl border transition-all text-sm sm:text-base font-medium ${btnClass}">
                <span class="w-6 h-6 rounded-lg bg-black/10 flex items-center justify-center text-xs font-bold mr-3 shrink-0">${letters[idx]}</span>
                <span class="flex-1">${opt}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    function buildUnscrambleInteractive(q, state) {
      if (!unscrambleDrafts[q.id]) unscrambleDrafts[q.id] = [];
      const draft = unscrambleDrafts[q.id];

      return `
        <div>
          <div class="text-xs text-slate-500 mb-2 font-semibold">依序點擊單字卡排入句子：</div>
          <div class="min-h-[52px] p-2.5 bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex flex-wrap gap-2 items-center mb-3">
            ${draft.length === 0 ? '<span class="text-xs text-slate-400">點擊下方單字排列...</span>' : ''}
            ${draft.map((wordIdx, slotIdx) => `
              <button onclick="removeFromUnscramble('${q.id}', ${slotIdx})" class="px-3 py-1.5 bg-purple-600 text-white text-xs sm:text-sm font-bold rounded-lg shadow-sm flex items-center space-x-1">
                <span>${q.words[wordIdx]}</span>
                <i class="fa-solid fa-xmark text-[10px] ml-1"></i>
              </button>
            `).join('')}
          </div>
          <div class="flex flex-wrap gap-2 mb-3">
            ${q.words.map((word, wIdx) => {
              const isUsed = draft.includes(wIdx);
              return `
                <button onclick="addToUnscramble('${q.id}', ${wIdx})" ${isUsed ? 'disabled' : ''}
                  class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold border ${isUsed ? 'bg-slate-100 text-slate-300 border-slate-200' : 'bg-white hover:bg-purple-50 text-slate-800 border-slate-300'}">
                  ${word}
                </button>
              `;
            }).join('')}
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="checkUnscramble('${q.id}')" ${draft.length === 0 ? 'disabled' : ''} class="px-4 py-2 bg-purple-600 text-white text-xs sm:text-sm font-bold rounded-xl shadow-sm">檢查答案</button>
            <button onclick="clearUnscramble('${q.id}')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs sm:text-sm font-semibold rounded-xl">清空重選</button>
          </div>
        </div>
      `;
    }

    function addToUnscramble(qId, wordIdx) {
      playChime('click');
      if (!unscrambleDrafts[qId]) unscrambleDrafts[qId] = [];
      unscrambleDrafts[qId].push(wordIdx);
      renderQuestions();
    }

    function removeFromUnscramble(qId, slotIdx) {
      playChime('click');
      if (!unscrambleDrafts[qId]) return;
      unscrambleDrafts[qId].splice(slotIdx, 1);
      renderQuestions();
    }

    function clearUnscramble(qId) {
      playChime('click');
      unscrambleDrafts[qId] = [];
      renderQuestions();
    }

    function checkUnscramble(qId) {
      const q = engQuestions.find(item => item.id === qId);
      const draft = unscrambleDrafts[qId] || [];
      const userSentence = draft.map(i => q.words[i]).join(' ');
      const isCorrect = userSentence.trim() === q.correctSentence.trim();
      handleAnswer(qId, userSentence, isCorrect);
    }

    function buildCategoryInteractive(q, state) {
      if (!state.userClassify) state.userClassify = {};

      return `
        <div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 mb-3">
            ${q.items.map((item, idx) => {
              const currentCat = state.userClassify[idx] || null;
              let catLabel = "未分類";
              if (currentCat === 'country') catLabel = "國家";
              if (currentCat === 'trans') catLabel = "交通工具";

              return `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex flex-col justify-between space-y-2">
                  <div class="font-extrabold text-sm text-slate-800">${item.word}</div>
                  <div class="flex space-x-1">
                    <button onclick="setClassifyWord('${q.id}', ${idx}, 'country')" class="flex-1 py-1 text-[11px] rounded-lg border font-semibold ${currentCat === 'country' ? 'bg-amber-600 text-white' : 'bg-white text-slate-600'}">國家</button>
                    <button onclick="setClassifyWord('${q.id}', ${idx}, 'trans')" class="flex-1 py-1 text-[11px] rounded-lg border font-semibold ${currentCat === 'trans' ? 'bg-cyan-600 text-white' : 'bg-white text-slate-600'}">交通</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <button onclick="checkClassifyAnswer('${q.id}')" class="px-4 py-2 bg-purple-600 text-white text-xs sm:text-sm font-bold rounded-xl shadow-sm">確認歸類</button>
        </div>
      `;
    }

    function setClassifyWord(qId, itemIdx, catType) {
      playChime('click');
      if (!answersState[qId]) answersState[qId] = { isAnswered: false, userChoice: null, isCorrect: false, userClassify: {} };
      if (!answersState[qId].userClassify) answersState[qId].userClassify = {};
      answersState[qId].userClassify[itemIdx] = catType;
      renderQuestions();
    }

    function checkClassifyAnswer(qId) {
      const q = engQuestions.find(item => item.id === qId);
      const userClassify = answersState[qId]?.userClassify || {};
      let allCorrect = true;
      for (let i = 0; i < q.items.length; i++) {
        if (userClassify[i] !== q.items[i].cat) {
          allCorrect = false;
          break;
        }
      }
      handleAnswer(qId, userClassify, allCorrect);
    }

    function handleAnswer(questionId, choice, overrideCorrectness = null) {
      const dataset = getCurrentDataset();
      const q = dataset.find(item => item.id === questionId);
      if (!q) return;

      let isCorrect = false;
      if (overrideCorrectness !== null) {
        isCorrect = overrideCorrectness;
      } else {
        isCorrect = (q.answer === choice);
      }

      answersState[questionId] = {
        isAnswered: true,
        userChoice: choice,
        isCorrect: isCorrect,
        showInExamReview: currentMode === 'exam' ? false : true
      };

      if (currentMode === 'instant') {
        playChime(isCorrect ? 'correct' : 'wrong');
      } else {
        playChime('click');
      }

      updateDashboardStats();
      renderQuestions();
    }

    function updateDashboardStats() {
      const dataset = getCurrentDataset();
      const total = dataset.length;
      let answered = 0;
      let correct = 0;
      let wrong = 0;

      dataset.forEach(q => {
        const state = answersState[q.id];
        if (state && state.isAnswered) {
          answered++;
          if (state.isCorrect) correct++;
          else wrong++;
        }
      });

      const accuracy = answered > 0 ? Math.round((correct / answered) * 100) : 0;
      const progressPercent = total > 0 ? (answered / total) * 100 : 0;

      document.getElementById('statAnswered').textContent = answered;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statCorrect').textContent = correct;
      document.getElementById('statWrong').textContent = wrong;
      document.getElementById('statAccuracy').textContent = `${accuracy}%`;
      document.getElementById('wrongCountBadge').textContent = wrong;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;
    }

    function resetCurrentQuiz() {
      const dataset = getCurrentDataset();
      dataset.forEach(q => {
        delete answersState[q.id];
        delete unscrambleDrafts[q.id];
      });
      playChime('click');
      updateDashboardStats();
      renderQuestions();
    }

    function submitExam() {
      const dataset = getCurrentDataset();
      let answeredCount = 0;
      let correctCount = 0;

      dataset.forEach(q => {
        const state = answersState[q.id];
        if (state && state.isAnswered) {
          answeredCount++;
          state.showInExamReview = true;
          if (state.isCorrect) correctCount++;
        }
      });

      const total = dataset.length;
      const finalScore = total > 0 ? Math.round((correctCount / total) * 100) : 0;
      const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

      document.getElementById('modalSubjectTag').textContent = '英語科測驗結算';
      document.getElementById('modalFinalScore').textContent = `${finalScore}分`;
      document.getElementById('modalCorrectCount').textContent = `${correctCount}/${total}`;
      document.getElementById('modalAccuracy').textContent = `${accuracy}%`;

      const titleElem = document.getElementById('modalScoreTitle');
      const iconElem = document.getElementById('modalScoreIcon');
      if (finalScore >= 90) {
        titleElem.textContent = "表現極度傑出！觀念掌握完美！";
        iconElem.innerHTML = '<i class="fa-solid fa-crown text-amber-500"></i>';
        playChime('correct');
      } else if (finalScore >= 70) {
        titleElem.textContent = "表現良好！複習錯題後能更上一層樓！";
        iconElem.innerHTML = '<i class="fa-solid fa-medal text-teal-500"></i>';
        playChime('correct');
      } else {
        titleElem.textContent = "再接再厲！看解析複習重要觀念！";
        iconElem.innerHTML = '<i class="fa-solid fa-book-bookmark text-indigo-500"></i>';
        playChime('wrong');
      }

      document.getElementById('scoreReportModal').classList.remove('hidden');
    }

    function closeScoreReport(keepReview) {
      document.getElementById('scoreReportModal').classList.add('hidden');
      if (keepReview) {
        currentMode = 'instant';
        setQuizMode('instant');
      }
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCategoryButtons();
      renderQuestions();
      updateDashboardStats();
    });
  </script>
</body>
</html>
